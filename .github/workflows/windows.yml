name: Windows portable build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build Windows x64 portable package
        run: go run ./scripts/build-windows.go
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/patch-*-windows-amd64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
